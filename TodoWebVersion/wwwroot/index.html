<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>&gt; TODO</h1>
        
        <input type="text" id="new-task" placeholder="add task...">
        <input type="date" id="new-date">
        <select id="new-priority">
            <option value="0">low</option>
            <option value="1">normal</option>
            <option value="2">high</option>
        </select>
        <button id="add-btn">+</button>
        <br>
        <p id="error-message"></p>
        <br>
        <button id="filter-all" class="filter-btn">all</button>
        <button id="filter-pending" class="filter-btn">pending</button>
        <button id="filter-completed" class="filter-btn">completed</button>

        
        <ul id="todo-list">
            
        </ul>
        
        <p id="task-counter"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
